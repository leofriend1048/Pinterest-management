[project]
name = "pinterest-ads-mcp"
version = "0.2.0"
description = "Run your Pinterest ad account by talking to Claude. An MCP server for media buyers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
pinterest-ads-mcp = "pinterest_ads_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinterest_ads_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
